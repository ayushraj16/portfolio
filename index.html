    <!-- Must run before ANY module: disables browser scroll restoration so reload always starts at top -->
    <script>
      // Disable browser scroll restoration
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      // Clear any URL hash (anchor jumps ignore scrollRestoration)
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      // Reset all scroll containers immediately
      function resetScroll() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }
      resetScroll();
      // Also reset after DOM is ready (catches late restoration)
      document.addEventListener('DOMContentLoaded', resetScroll);
      // Catches back/forward cache restores
      window.addEventListener('pageshow', function(e) { if (e.persisted) resetScroll(); });
    </script>
